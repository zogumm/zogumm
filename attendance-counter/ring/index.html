<title>허니유 출석부 링 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  /* Layout: 시안 툴바 → 폰 한 화면. 링이 공통 언어이고, 시안마다 링이 놓이는 자리(현황 블록·마스코트·돔)가 다르다.
     앱이 밝은 화면이라 라이트 한 가지로 고정하고 모든 색을 명시한다. */
  :root {
    --cream: #faf5ea;
    --paper: #fffdf7;
    --ink: #17140f;
    --ink-soft: #6f6556;
    --line: #ebe1cf;
    --seat: #ebe2d1;
    --honey: #feda2e;
    --amber: #f29a00;
    --amber-ink: #b45f00;
    --amber-bg: #fff3d6;
    --berry: #e0341f;      /* 마스코트 빨강 — 노란 돔 위 링 색 */
    --away: #d6453d;
    --away-bg: #fdecea;
    --font-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
    --font-num: "Bagel Fat One", "Jua", system-ui, sans-serif;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: #efe7d6; color: var(--ink);
    font-family: var(--font-body);
    padding-inline: 16px; padding-block: 20px 40px;
    display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: start; gap: 16px;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  svg circle, svg path { transition: stroke-dashoffset .5s, stroke-dasharray .5s; }

  /* ---------- 툴바 ---------- */
  .toolbar { width: 100%; max-width: 400px; display: grid; gap: 10px; }
  .toolbar h1 { margin: 0; font: 400 20px/1.2 var(--font-display); }
  .toolbar p { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 4px; background: var(--paper); border-radius: 14px; border: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; cursor: pointer; border-radius: 10px; padding: 8px 2px; display: grid; gap: 2px; justify-items: center; }
  .tabs b { font: 400 16px/1 var(--font-display); }
  .tabs small { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .tabs button[aria-selected="true"] small { color: #d9cfbd; }
  .why { font-size: 13px; line-height: 1.55; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0; }
  .why b { font-weight: 700; }
  .range { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .range input { flex: 1; min-width: 0; accent-color: var(--amber); }
  .range strong { color: var(--ink); min-width: 4.5em; text-align: right; }

  /* ---------- 폰 ---------- */
  .phone { width: 100%; max-width: 400px; background: var(--cream); border-radius: 32px; overflow: hidden; border: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); }
  .screen { padding: 22px 20px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font: 400 22px/1 var(--font-display); }
  .teacher { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 5px; border-radius: 999px; background: var(--paper); box-shadow: 0 2px 10px rgba(80, 60, 20, .08); font-size: 14px; font-weight: 700; white-space: nowrap; }
  .teacher img { width: 30px; height: 30px; border-radius: 50%; }
  .session { justify-self: start; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; padding: 9px 14px 9px 16px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 700; }
  .session svg { opacity: .7; }
  .stats { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

  /* 공통 조각 */
  .ring { position: relative; flex: none; }
  .ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .num { font-family: var(--font-num); font-weight: 400; color: var(--amber); font-variant-numeric: tabular-nums; line-height: .9; }
  .sub { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .title { margin: 0; font: 400 26px/1.15 var(--font-display); text-wrap: balance; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-row.in { background: var(--amber-bg); color: var(--amber-ink); }
  .stat-row.out { background: var(--away-bg); color: var(--away); }
  .stat-row strong { font-size: 18px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .list-btn { width: 100%; border: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 54px; padding: 0 16px 0 18px; border-radius: 16px; background: var(--paper); font-size: 16px; font-weight: 700; text-align: left; }
  .list-btn em { font-style: normal; color: var(--away); font-variant-numeric: tabular-nums; }
  .list-btn svg { flex: none; color: var(--ink-soft); }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
  .card header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; }
  .card header span { color: var(--away); font-variant-numeric: tabular-nums; }
  .card header button { border: 0; background: none; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink-soft); padding: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { padding: 6px 10px; border-radius: 999px; background: var(--cream); font-size: 13px; font-weight: 500; }
  .chips .more { background: var(--ink); color: var(--paper); font-weight: 700; }
  .note { font-size: 11px; color: var(--ink-soft); }

  /* 1. 기본 링 */
  .v1 { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: center; }
  .v1 .ring { width: 150px; height: 150px; }
  .v1 .num { font-size: 50px; }
  .v1 .side { display: grid; gap: 8px; }

  /* 2. 링 + 이름 */
  .v2 { display: flex; align-items: center; gap: 16px; }
  .v2 .ring { width: 104px; height: 104px; }
  .v2 .num { font-size: 36px; }
  .v2 .title { font-size: 28px; }
  .v2 .sub { margin-top: 4px; display: block; }

  /* 4. 돔 게이지용 요약 */
  .v4 { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .v4 .num { font-size: 68px; }
  .v4 .of { font: 400 26px/1 var(--font-display); }
  .v4 .tag { font-size: 13px; font-weight: 700; color: var(--amber-ink); background: var(--amber-bg); padding: 6px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }

  /* 5. 조각 링 */
  .v5 { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 16px; align-items: center; }
  .v5 .ring { width: 160px; height: 160px; }
  .v5 .num { font-size: 48px; }
  .recent { display: grid; gap: 6px; }
  .recent h3 { margin: 0; font-size: 13px; color: var(--ink-soft); font-weight: 700; }
  .recent ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .recent li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); font-size: 14px; font-weight: 700; }
  .recent li time { color: var(--ink-soft); font-weight: 500; font-variant-numeric: tabular-nums; }
  .recent li:first-child { border-color: var(--amber); }
  .recent .empty { font-size: 13px; color: var(--ink-soft); }

  /* ---------- 마스코트 영역 ---------- */
  .hero { position: relative; margin-top: 6px; height: 270px; display: grid; justify-items: center; }
  .hero .dome { position: absolute; inset: 0 -40px; background: var(--honey); border-radius: 50% 50% 0 0 / 120px 120px 0 0; }
  .hero .mascot { position: relative; width: 230px; max-width: 70%; margin-top: 22px; }
  .start { position: absolute; left: 20px; right: 20px; bottom: 20px; border: 0; cursor: pointer; min-height: 62px; border-radius: 999px; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; gap: 10px; font: 400 24px/1 var(--font-display); box-shadow: 0 8px 20px rgba(23, 20, 15, .25); z-index: 2; }

  /* 3. 마스코트 링: 마스코트 얼굴을 링이 감싼다 */
  .halo { position: relative; width: 210px; height: 210px; margin-top: 14px; }
  .halo .face { position: absolute; inset: 18px; border-radius: 50%; overflow: hidden; background: var(--honey); }
  .halo .face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 10%; }
  .halo svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .halo .badge { position: absolute; top: 4px; right: -6px; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 6px 12px; font: 400 18px/1 var(--font-num); font-variant-numeric: tabular-nums; box-shadow: 0 4px 10px rgba(23,20,15,.2); }
  .hero.v3h { height: 300px; }

  /* 4. 돔 게이지: 반원 링이 마스코트 위로 걸린다 */
  .gauge { position: relative; width: 300px; max-width: 92%; margin-top: 14px; }
  .gauge svg { display: block; width: 100%; height: auto; overflow: visible; }
  .gauge .mascot { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); width: 64%; max-width: none; margin: 0; }
  .gauge .ends { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #6b5300; padding-inline: 2px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .hero.v4h { height: 320px; }

  .tabbar { background: var(--cream); padding: 12px 16px 18px; }
  .tabbar div { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: var(--honey); }
  .tabbar button { border: 0; cursor: pointer; background: none; padding: 13px 0; border-radius: 999px; font: 400 18px/1 var(--font-display); color: #6b5300; }
  .tabbar button[aria-current="page"] { background: var(--paper); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
  const TOTAL = 47;
  const NAMES = ["김민준","이서연","박지호","최하윤","정도윤","강서아","조예준","윤지우","장시우","임하은","한주원","오채원","서건우","신유나","권은우","황수아"];
  const WHY = {
    1: "<b>기본 링.</b> 지난번에 고른 그대로예요. 비교 기준으로 두었어요.",
    2: "<b>링 + 이름.</b> 링은 작게 줄이고, 안 온 학생 이름을 첫 화면에 바로 보여줘요. 명단을 따로 열 필요가 없어요.",
    3: "<b>마스코트 링.</b> 링이 마스코트 얼굴을 감싸요. 학생이 올 때마다 빨간 링이 차오르니까 화면 아래쪽도 현황판이 돼요.",
    4: "<b>돔 게이지.</b> 노란 돔 위에 반원 게이지를 걸었어요. 위쪽은 숫자 한 줄로 끝나서 화면이 가장 가벼워요.",
    5: "<b>조각 링.</b> 링을 47칸으로 나눠서 한 칸이 학생 한 명이에요. 옆에 방금 온 학생이 떠서 인식이 잘 됐는지 바로 확인할 수 있어요."
  };
  const $ = id => document.getElementById(id);

  function render(arrived) {
    const out = TOTAL - arrived, frac = arrived / TOTAL;
    const vals = { in: arrived, out, pct: Math.round(frac * 100) + "%" };
    document.querySelectorAll("[data-k]").forEach(el => el.textContent = vals[el.dataset.k]);
    $("range-val").textContent = `${arrived} / ${TOTAL}명`;

    // 연속 링: pathLength 100 기준
    document.querySelectorAll(".arc").forEach(a => {
      a.style.strokeDashoffset = 100 * (1 - frac);
      a.style.visibility = arrived ? "visible" : "hidden";
    });
    // 조각 링: 7칸 칠하고 3칸 비우기를 n번
    $("seg-arc").setAttribute("stroke-dasharray", arrived ? Array(arrived).fill("7 3").join(" ") + " 0 470" : "0 470");

    const shown = Math.min(out, 7);
    document.querySelectorAll("[data-chips]").forEach(c => c.innerHTML =
      NAMES.slice(0, shown).map(n => `<span>${n}</span>`).join("") +
      (out > shown ? `<span class="more">+${out - shown}명</span>` : "") +
      (out === 0 ? `<span>모두 왔어요</span>` : ""));

    // 최근 도착 3명 (예시): 10:31부터 거꾸로
    const recent = [];
    for (let i = 0; i < Math.min(arrived, 3); i++) {
      const m = 31 - i * 2;
      recent.push(`<li>${NAMES[(15 - i) % NAMES.length]}<time>10:${String(m).padStart(2, "0")}</time></li>`);
    }
    $("recent").innerHTML = recent.join("") || `<li class="empty">아직 아무도 안 왔어요</li>`;

    document.querySelectorAll(".list-btn").forEach(b => b.hidden = out === 0);
  }

  function pick(v) {
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
    document.querySelectorAll("[data-variant]").forEach(s => s.hidden = s.dataset.variant !== v);
    document.querySelectorAll("[data-hero]").forEach(h => h.hidden = !h.dataset.hero.split(" ").includes(v));
    $("hero").className = "hero" + (v === "3" ? " v3h" : v === "4" ? " v4h" : "");
    $("why").innerHTML = WHY[v];
    try { localStorage.setItem("ring-variant", v); } catch (e) {}
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => pick(b.dataset.v)));
  let start = "1";
  try { start = localStorage.getItem("ring-variant") || "1"; } catch (e) {}
  pick(WHY[start] ? start : "1");
  $("arrived-range").addEventListener("input", e => render(+e.target.value));
  render(1);
</script>
