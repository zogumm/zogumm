<title>허니유 출석부 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  /* Layout: 시안 고르는 툴바 → 폰 한 화면(헤더 · 회차 · 현황 블록 · 마스코트 · 탭). 현황 블록만 시안마다 다르다.
     앱 자체가 밝은 화면이라 라이트 한 가지로 고정하고 모든 색을 명시한다. */
  :root {
    --cream: #faf5ea;
    --paper: #fffdf7;
    --ink: #17140f;
    --ink-soft: #6f6556;
    --line: #ebe1cf;
    --seat: #ebe2d1;
    --honey: #feda2e;      /* 마스코트 배경과 같은 노랑 */
    --amber: #f29a00;      /* 온 사람 */
    --amber-ink: #b45f00;
    --away: #d6453d;       /* 아직 안 온 사람, 절제해서 */
    --away-bg: #fdecea;
    --font-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
    --font-num: "Bagel Fat One", "Jua", system-ui, sans-serif;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: #efe7d6; color: var(--ink);
    font-family: var(--font-body);
    padding-inline: 16px; padding-block: 20px 40px;
    display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: start; gap: 16px;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  /* ---------- 시안 툴바 ---------- */
  .toolbar { width: 100%; max-width: 400px; display: grid; gap: 10px; }
  .toolbar h1 { margin: 0; font: 400 20px/1.2 var(--font-display); }
  .toolbar p { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--paper); border-radius: 14px; border: 1px solid var(--line); }
  .tabs button {
    border: 0; background: transparent; cursor: pointer; border-radius: 10px;
    padding: 8px 4px; display: grid; gap: 1px; justify-items: center;
  }
  .tabs b { font: 400 16px/1 var(--font-display); }
  .tabs small { font-size: 11px; color: var(--ink-soft); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .tabs button[aria-selected="true"] small { color: #d9cfbd; }
  .range { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .range input { flex: 1; min-width: 0; accent-color: var(--amber); }
  .range strong { color: var(--ink); min-width: 4.5em; text-align: right; }

  /* ---------- 폰 화면 ---------- */
  .phone {
    width: 100%; max-width: 400px;
    background: var(--cream);
    border-radius: 32px; overflow: hidden;
    border: 1px solid var(--line);
    display: grid; grid-template-columns: minmax(0, 1fr);
  }
  .screen { padding: 22px 20px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font: 400 22px/1 var(--font-display); }
  .teacher {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 14px 5px 5px; border-radius: 999px; background: var(--paper);
    box-shadow: 0 2px 10px rgba(80, 60, 20, .08);
    font-size: 14px; font-weight: 700; white-space: nowrap;
  }
  .teacher img { width: 30px; height: 30px; border-radius: 50%; }
  .session {
    justify-self: start; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 14px 9px 16px; border-radius: 999px;
    background: var(--ink); color: var(--paper);
    font-size: 14px; font-weight: 700;
  }
  .session svg { opacity: .7; }

  .stats { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }

  /* 공통 조각 */
  .of { font-size: 16px; font-weight: 700; color: var(--ink-soft); }
  .count { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0; }
  .count b { font: 400 76px/.9 var(--font-num); color: var(--amber); font-variant-numeric: tabular-nums; }
  .count span { font: 400 28px/1 var(--font-display); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--seat); }
  .legend .in i { background: var(--amber); }
  .legend strong { color: var(--ink); }
  .legend .pct { margin-left: auto; font-weight: 700; color: var(--amber-ink); }
  .list-btn {
    width: 100%; border: 1px solid var(--line); cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    min-height: 54px; padding: 0 16px 0 18px; border-radius: 16px;
    background: var(--paper); font-size: 16px; font-weight: 700; text-align: left;
  }
  .list-btn em { font-style: normal; color: var(--away); font-variant-numeric: tabular-nums; }
  .list-btn svg { flex: none; color: var(--ink-soft); }

  /* A. 점 그리드 */
  .dots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
  .dots li { aspect-ratio: 1; border-radius: 50%; background: var(--seat); transition: background-color .3s; }
  .dots li.in { background: var(--amber); }

  /* B. 벌집 */
  .comb-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: end; }
  .comb { display: grid; justify-items: center; padding-block: 4px; }
  .comb .row { display: flex; gap: 2px; }
  .comb .row + .row { margin-top: -6px; }
  .hex {
    width: 28px; height: 32px; background: var(--seat);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    transition: background-color .3s;
  }
  .hex.in { background: var(--amber); }

  /* C. 링 */
  .ring-wrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; align-items: center; }
  .ring { position: relative; width: 150px; height: 150px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .center b { font: 400 50px/.9 var(--font-num); color: var(--amber); font-variant-numeric: tabular-nums; }
  .ring .center small { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .ring circle { transition: stroke-dashoffset .5s; }
  .ring-side { display: grid; gap: 8px; }
  .ring-side h2 { margin: 0; font: 400 26px/1.15 var(--font-display); text-wrap: balance; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-row.in { background: #fff3d6; color: var(--amber-ink); }
  .stat-row.out { background: var(--away-bg); color: var(--away); }
  .stat-row strong { font-size: 18px; }

  /* D. 이름 */
  .frac { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
  .frac b { font: 400 64px/.9 var(--font-num); color: var(--amber); }
  .frac span { font: 400 28px/1 var(--font-num); color: #c9bda7; }
  .frac em { margin-left: auto; font-style: normal; font: 400 20px/1 var(--font-display); }
  .bar { height: 12px; border-radius: 999px; background: var(--seat); overflow: hidden; }
  .bar i { display: block; height: 100%; min-width: 12px; border-radius: inherit; background: var(--amber); transition: width .4s; }
  .missing { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
  .missing header { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
  .missing header span { color: var(--away); font-variant-numeric: tabular-nums; }
  .missing header button { border: 0; background: none; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink-soft); padding: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { padding: 6px 10px; border-radius: 999px; background: var(--cream); font-size: 13px; font-weight: 500; }
  .chips .more { background: var(--ink); color: var(--paper); font-weight: 700; }
  .note { font-size: 11px; color: var(--ink-soft); }

  /* ---------- 마스코트 + 출석 시작 ---------- */
  .hero { position: relative; margin-top: 8px; height: 270px; display: grid; justify-items: center; }
  .hero::before {
    content: ""; position: absolute; inset: 0 -40px 0; top: 0;
    background: var(--honey); border-radius: 50% 50% 0 0 / 120px 120px 0 0;
  }
  .hero img { position: relative; width: 230px; max-width: 70%; margin-top: 22px; }
  .start {
    position: absolute; left: 20px; right: 20px; bottom: 20px;
    border: 0; cursor: pointer; min-height: 62px; border-radius: 999px;
    background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font: 400 24px/1 var(--font-display);
    box-shadow: 0 8px 20px rgba(23, 20, 15, .25);
  }
  .tabbar { background: var(--cream); padding: 12px 16px 18px; }
  .tabbar div { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: var(--honey); }
  .tabbar button { border: 0; cursor: pointer; background: none; padding: 13px 0; border-radius: 999px; font: 400 18px/1 var(--font-display); color: #6b5300; }
  .tabbar button[aria-current="page"] { background: var(--paper); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</div>

<script>
  const TOTAL = 47;
  const NAMES = ["김민준","이서연","박지호","최하윤","정도윤","강서아","조예준","윤지우","장시우","임하은","한주원","오채원","서건우","신유나","권은우","황수아"];
  const $ = id => document.getElementById(id);

  // A: 점 47개
  for (let i = 0; i < TOTAL; i++) $("dots").appendChild(document.createElement("li"));
  // B: 벌집 10·9·10·9·9 = 47칸
  [10, 9, 10, 9, 9].forEach(n => {
    const row = document.createElement("div"); row.className = "row";
    for (let i = 0; i < n; i++) { const h = document.createElement("div"); h.className = "hex"; row.appendChild(h); }
    $("comb").appendChild(row);
  });

  function render(arrived) {
    const out = TOTAL - arrived, pct = Math.round(arrived / TOTAL * 100);
    const vals = { in: arrived, out, pct: pct + "%" };
    document.querySelectorAll("[data-k]").forEach(el => el.textContent = vals[el.dataset.k]);
    $("range-val").textContent = `${arrived} / ${TOTAL}명`;
    [...$("dots").children].forEach((li, i) => li.classList.toggle("in", i < arrived));
    [...document.querySelectorAll(".hex")].forEach((h, i) => h.classList.toggle("in", i < arrived));
    const C = 314.16; $("ring-arc").setAttribute("stroke-dashoffset", arrived ? C * (1 - arrived / TOTAL) : C);
    $("bar").style.width = (arrived / TOTAL * 100) + "%";
    $("bar").style.display = arrived ? "" : "none";
    const shown = Math.min(out, 7);
    $("chips").innerHTML = NAMES.slice(0, shown).map(n => `<span>${n}</span>`).join("") +
      (out > shown ? `<span class="more">+${out - shown}명</span>` : "") +
      (out === 0 ? `<span>모두 왔어요</span>` : "");
    document.querySelectorAll(".list-btn").forEach(b => b.hidden = out === 0);
  }

  document.querySelectorAll(".tabs button").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b === btn));
    document.querySelectorAll("[data-variant]").forEach(s => s.hidden = s.dataset.variant !== btn.dataset.v);
    try { localStorage.setItem("variant", btn.dataset.v); } catch (e) {}
  }));
  try { const v = localStorage.getItem("variant"); if (v) document.querySelector(`.tabs [data-v="${v}"]`)?.click(); } catch (e) {}
  $("arrived-range").addEventListener("input", e => render(+e.target.value));
  render(1);
</script>
